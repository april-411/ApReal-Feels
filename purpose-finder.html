<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Purpose Field — Fields of Freedom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0906;
    --bg-2: #111009;
    --card: #16140d;
    --gold: #c9a15c;
    --gold-bright: #e8c77e;
    --gold-dim: rgba(201,161,92,0.35);
    --cream: #f3ede0;
    --muted: #a89a7d;
    --line: rgba(201,161,92,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(201,161,92,0.10), transparent 60%),
      var(--bg);
    color:var(--cream);
    font-family:'EB Garamond', serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }
  .stage{
    width:100%;
    max-width:460px;
  }
  .eyebrow{
    font-family:'EB Garamond', serif;
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:18px;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";
    height:1px;
    width:24px;
    background:var(--gold-dim);
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(28px,7vw,38px);
    line-height:1.15;
    text-align:center;
    margin:0 0 14px;
    color:var(--cream);
  }
  h1 em{
    font-style:italic;
    color:var(--gold-bright);
    font-weight:600;
  }
  .lede{
    text-align:center;
    color:var(--muted);
    font-size:17px;
    line-height:1.6;
    margin:0 auto 30px;
    max-width:380px;
  }
  .btn{
    display:block;
    width:100%;
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold-bright);
    font-family:'EB Garamond', serif;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    padding:16px 20px;
    border-radius:2px;
    cursor:pointer;
    text-align:center;
    transition:background .25s ease, color .25s ease;
  }
  .btn:hover, .btn:focus-visible{
    background:var(--gold);
    color:#171208;
    outline:none;
  }
  .btn:focus-visible{ box-shadow:0 0 0 3px rgba(201,161,92,0.35); }
  .btn-ghost{
    border-color:var(--line);
    color:var(--muted);
    margin-top:12px;
  }
  .btn-ghost:hover, .btn-ghost:focus-visible{
    background:transparent;
    color:var(--gold-bright);
    border-color:var(--gold);
  }

  /* progress: "rows in the field" */
  .field-progress{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
    gap:14px;
  }
  .field-progress .row-label{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }
  .field-progress .track{
    flex:1;
    height:1px;
    background:var(--line);
    position:relative;
  }
  .field-progress .fill{
    position:absolute;
    left:0; top:-1px;
    height:3px;
    background:var(--gold);
    transition:width .45s ease;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    padding:30px 24px;
    border-radius:2px;
  }

  .q-eyebrow{
    font-size:11px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }
  .q-text{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(21px,5.5vw,25px);
    line-height:1.35;
    margin:0 0 26px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    text-align:left;
    background:transparent;
    border:1px solid var(--line);
    color:var(--cream);
    font-family:'EB Garamond', serif;
    font-size:16px;
    padding:15px 16px;
    border-radius:2px;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease, transform .12s ease;
  }
  .option:hover, .option:focus-visible{
    border-color:var(--gold);
    background:rgba(201,161,92,0.08);
    outline:none;
  }
  .option:active{ transform:scale(0.995); }

  /* results */
  .badge-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
  }
  .badge-ring{
    width:112px; height:112px;
    border:1px solid var(--gold-dim);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .badge-ring::before{
    content:"";
    position:absolute;
    inset:-8px;
    border:1px solid rgba(201,161,92,0.12);
    border-radius:50%;
  }
  .result-eyebrow{
    text-align:center;
    font-size:11px;
    letter-spacing:0.26em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .result-name{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:clamp(30px,8vw,40px);
    text-align:center;
    color:var(--gold-bright);
    margin:0 0 6px;
  }
  .result-stage{
    text-align:center;
    font-style:italic;
    color:var(--muted);
    font-size:16px;
    margin:0 0 22px;
  }
  .result-desc{
    font-size:17px;
    line-height:1.7;
    color:var(--cream);
    margin:0 0 22px;
  }
  .divider{
    height:1px;
    background:var(--line);
    margin:22px 0;
  }
  .breakdown-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    font-size:13px;
  }
  .breakdown-row .label{
    width:92px;
    color:var(--muted);
    letter-spacing:0.05em;
  }
  .breakdown-row .bar-track{
    flex:1;
    height:5px;
    background:rgba(255,255,255,0.06);
    position:relative;
    border-radius:2px;
  }
  .breakdown-row .bar-fill{
    position:absolute;
    left:0; top:0; height:100%;
    background:var(--gold);
    border-radius:2px;
    transition:width .6s ease;
  }
  .breakdown-row .val{
    width:18px;
    text-align:right;
    color:var(--muted);
  }
  .cta-group{ margin-top:26px; display:flex; flex-direction:column; gap:10px; }
  footer{
    text-align:center;
    margin-top:22px;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--muted);
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <a href="index.html" style="display:inline-block; margin-bottom:22px; font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); text-decoration:none;">← Back to Fields of Freedom</a>
</div>
<div class="stage" id="app"></div>

<script>
const QUESTIONS = [
  { q: "When a new project lands on your desk, your first instinct is to:", opts: [
    ["Break it into a step-by-step plan","builder"],
    ["Figure out who needs to be looped in","connector"],
    ["Identify what could go wrong and guard against it","guardian"],
    ["Picture what success ultimately looks like","visionary"]
  ]},
  { q: "The people around you would say you're the one who:", opts: [
    ["Gets things done, no matter what","builder"],
    ["Makes everyone feel like they belong","connector"],
    ["Holds the line when things get hard","guardian"],
    ["Sees possibilities before anyone else does","visionary"]
  ]},
  { q: "When you face a setback, you tend to:", opts: [
    ["Rebuild the plan and keep moving","builder"],
    ["Reach out to your circle for support","connector"],
    ["Reassess what needs protecting","guardian"],
    ["Reframe it as part of a bigger story","visionary"]
  ]},
  { q: "People come to you when they need:", opts: [
    ["A system, or a plan","builder"],
    ["Someone to listen without judgment","connector"],
    ["Someone to tell them the hard truth","guardian"],
    ["Inspiration, or a reason to keep going","visionary"]
  ]},
  { q: "Your idea of a productive day includes:", opts: [
    ["Checking things off a list","builder"],
    ["Meaningful conversations","connector"],
    ["Protecting your time and your boundaries","guardian"],
    ["Dreaming and strategizing","visionary"]
  ]},
  { q: "In a crisis, your natural role is:", opts: [
    ["The one who organizes the response","builder"],
    ["The one who rallies people together","connector"],
    ["The one who keeps everyone safe","guardian"],
    ["The one who casts the vision forward","visionary"]
  ]},
  { q: "What energizes you most?", opts: [
    ["Seeing a plan executed well","builder"],
    ["Deep relationships and community","connector"],
    ["Standing up for what's right","guardian"],
    ["Imagining what's next","visionary"]
  ]},
  { q: "What drains you most?", opts: [
    ["Chaos with no clear plan","builder"],
    ["Isolation","connector"],
    ["Compromising your values","guardian"],
    ["Being stuck in routine, with no room to think ahead","visionary"]
  ]},
  { q: "Your leadership style leans toward:", opts: [
    ["Operational — you build the systems that make things run","builder"],
    ["Relational — you build the team that makes things run","connector"],
    ["Principled — you build the culture that makes things run","guardian"],
    ["Strategic — you build the direction that makes things run","visionary"]
  ]},
  { q: "When you think about your purpose, it's rooted in:", opts: [
    ["Creating something lasting","builder"],
    ["Bringing people together","connector"],
    ["Protecting and defending others","guardian"],
    ["Pointing others toward what's possible","visionary"]
  ]}
];

const PROFILES = {
  builder: {
    name: "The Builder",
    stage: "Cultivate the Ground",
    icon: iconBuilder,
    desc: "You turn vision into infrastructure. In leadership terms, you're the operations backbone — the strategic executor who builds systems that outlast the moment you built them in. In the Method, you are called to <em>cultivate</em>: tilling the ground so whatever gets planted actually takes root. Your growth edge is patience with process; your gift is making the invisible actionable."
  },
  connector: {
    name: "The Connector",
    stage: "Harvest the Freedom",
    icon: iconConnector,
    desc: "You lead through relationship capital — the trust-builder who turns a group of individuals into an aligned team. In leadership terms, you're the culture-carrier. In the Method, you are called to <em>harvest</em>: gathering people in and celebrating what's grown. Your growth edge is setting boundaries so connection doesn't become depletion; your gift is making people feel like they belong."
  },
  guardian: {
    name: "The Guardian",
    stage: "Clear the Field",
    icon: iconGuardian,
    desc: "You lead with integrity as your operating principle — the one who protects the mission and won't compromise the standard. In leadership terms, you're the risk-manager and culture-protector. In the Method, you are called to <em>clear the field</em>: removing what doesn't belong so the harvest isn't compromised. Your growth edge is trusting others to hold the line too; your gift is courage under pressure."
  },
  visionary: {
    name: "The Visionary",
    stage: "Declare It Possible",
    icon: iconVisionary,
    desc: "You lead from what's next — the strategist who sees several moves ahead and casts a vision others can follow. In leadership terms, you're the chief vision officer of your own life. In the Method, you are called to <em>declare</em>: speaking possibility into a field that hasn't been planted yet. Your growth edge is staying grounded in today's ground-work; your gift is seeing what others can't yet see."
  }
};

// Replace with your own Formspree endpoint (or any form-to-email service).
// Sign up free at https://formspree.io, create a form, and paste its endpoint here.
const FORM_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";

let current = 0;
let scores = { builder:0, connector:0, guardian:0, visionary:0 };
let leadEmail = "";

const app = document.getElementById('app');

function iconBuilder(){ return `<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="${cssVar('--gold-bright')}" stroke-width="1.3"><rect x="9" y="20" width="9" height="9"/><rect x="22" y="20" width="9" height="9"/><rect x="15.5" y="9" width="9" height="9"/></svg>`; }
function iconConnector(){ return `<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="${cssVar('--gold-bright')}" stroke-width="1.3"><circle cx="15" cy="20" r="8"/><circle cx="25" cy="20" r="8"/></svg>`; }
function iconGuardian(){ return `<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="${cssVar('--gold-bright')}" stroke-width="1.3"><path d="M20 8 L31 12 V20 C31 27 26 32 20 34 C14 32 9 27 9 20 V12 Z"/></svg>`; }
function iconVisionary(){ return `<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="${cssVar('--gold-bright')}" stroke-width="1.3"><path d="M20 6 V16 M20 34 V24 M20 20 L28 8 M20 20 L12 32"/><circle cx="20" cy="20" r="3"/></svg>`; }

function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderIntro(){
  app.innerHTML = `
    <div class="eyebrow">Fields of Freedom Method</div>
    <h1>Find Your <em>Purpose Field</em></h1>
    <p class="lede">Ten short questions on your skills, your passions, and what people already trust you for. At the end, you'll see which stage of the Method you naturally lead from — and where your purpose is asking you to grow.</p>
    <button class="btn" id="startBtn">Begin</button>
  `;
  document.getElementById('startBtn').addEventListener('click', () => {
    current = 0;
    scores = { builder:0, connector:0, guardian:0, visionary:0 };
    renderQuestion();
  });
}

function renderQuestion(){
  const total = QUESTIONS.length;
  const item = QUESTIONS[current];
  const pct = Math.round((current / total) * 100);

  app.innerHTML = `
    <div class="field-progress">
      <span class="row-label">Row ${current+1} of ${total}</span>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div class="card">
      <div class="q-eyebrow">Question ${current+1}</div>
      <p class="q-text">${item.q}</p>
      <div class="options">
        ${item.opts.map((o,i) => `<button class="option" data-key="${o[1]}" data-idx="${i}">${o[0]}</button>`).join('')}
      </div>
    </div>
  `;

  document.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-key');
      scores[key] += 1;
      current += 1;
      if (current < QUESTIONS.length) {
        renderQuestion();
      } else {
        renderEmailGate();
      }
    });
  });
}

function renderEmailGate(){
  app.innerHTML = `
    <div class="eyebrow">Your Field Is Ready</div>
    <h1>Where Should We <em>Send It</em>?</h1>
    <p class="lede">Enter your email to reveal your Purpose Field and get your full results sent to your inbox.</p>
    <div class="card">
      <form id="gateForm">
        <div class="options" style="margin-bottom:16px;">
          <input type="email" id="gateEmail" required placeholder="you@email.com"
            style="background:transparent;border:1px solid var(--line);color:var(--cream);
            font-family:'EB Garamond',serif;font-size:16px;padding:15px 16px;border-radius:2px;width:100%;">
        </div>
        <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5;">
          <input type="checkbox" id="gateConsent" required style="margin-top:3px;">
          <span>Send me my results and occasional follow-up from Fields of Freedom. Unsubscribe anytime.</span>
        </label>
        <button type="submit" class="btn" id="gateSubmit">Reveal My Purpose Field</button>
        <p id="gateError" style="color:#c97b5c;font-size:13px;text-align:center;margin:12px 0 0;display:none;">Please enter a valid email and check the box above.</p>
      </form>
    </div>
  `;

  document.getElementById('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('gateEmail').value.trim();
    const consent = document.getElementById('gateConsent').checked;
    const errorEl = document.getElementById('gateError');
    if (!email || !consent) {
      errorEl.style.display = 'block';
      return;
    }
    leadEmail = email;
    const submitBtn = document.getElementById('gateSubmit');
    submitBtn.textContent = "Sending...";
    submitBtn.disabled = true;

    const order = Object.keys(scores).sort((a,b) => scores[b]-scores[a]);
    const topProfile = PROFILES[order[0]].name;

    try {
      await fetch(FORM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          email: email,
          purpose_field: topProfile,
          scores: scores,
          source: "Purpose Finder Quiz"
        })
      });
    } catch (err) {
      // Non-blocking: even if the send fails, still show the results on-screen.
      console.error("Lead capture failed:", err);
    }

    renderResults();
  });
}

function renderResults(){
  const order = Object.keys(scores).sort((a,b) => scores[b]-scores[a]);
  const topKey = order[0];
  const profile = PROFILES[topKey];
  const total = QUESTIONS.length;

  app.innerHTML = `
    <div class="badge-wrap"><div class="badge-ring">${profile.icon()}</div></div>
    <div class="result-eyebrow">Your Purpose Field Is</div>
    <h2 class="result-name">${profile.name}</h2>
    <p class="result-stage">Natural home stage: ${profile.stage}</p>
    <p class="result-desc">${profile.desc}</p>
    <div class="divider"></div>
    ${order.map(key => `
      <div class="breakdown-row">
        <span class="label">${PROFILES[key].name.replace('The ','')}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((scores[key]/total)*100)}%"></div></div>
        <span class="val">${scores[key]}</span>
      </div>
    `).join('')}
    <div class="cta-group">
      <a class="btn" href="https://calendly.com/fieldsoffreedom/30min" target="_blank" rel="noopener">Book a 30-Min Call</a>
      <button class="btn btn-ghost" id="retakeBtn">Retake the Quiz</button>
    </div>
    <footer>Fields of Freedom · Declare It Possible · Clear the Field · Cultivate the Ground · Harvest the Freedom</footer>
  `;

  document.getElementById('retakeBtn').addEventListener('click', renderIntro);
}

renderIntro();
</script>
</body>
</html>
