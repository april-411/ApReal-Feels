<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Find Your Purpose Field — F.E.E.L.S. Method · Fields of Freedom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --card:#07150d;
    --green:#14472b;
    --green-deep:#0d2e1c;
    --gold:#d9ac3f;
    --gold-bright:#f4d37a;
    --gold-dim:rgba(217,172,63,0.4);
    --cream:#f6efdc;
    --muted:#b9ae90;
    --line:rgba(217,172,63,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;min-height:100%;}
  body{
    background:
      radial-gradient(ellipse 110% 50% at 50% -8%, rgba(217,172,63,0.16), transparent 62%),
      radial-gradient(ellipse 90% 40% at 50% 112%, rgba(20,71,43,0.55), transparent 65%),
      var(--bg);
    color:var(--cream);
    font-family:'EB Garamond',serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  }
  .stage{width:100%;max-width:480px;}
  .logo{display:block;width:min(240px,62%);height:auto;margin:0 auto 14px;}
  .eyebrow{
    font-family:'Cinzel',serif;font-size:12px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--gold);text-align:center;margin-bottom:14px;
  }
  h1{
    font-family:'Playfair Display',serif;font-weight:600;
    font-size:clamp(28px,7vw,38px);line-height:1.15;text-align:center;margin:0 0 14px;
  }
  h1 .script{font-style:italic;color:var(--gold-bright);}
  .lede{text-align:center;color:var(--muted);font-size:17.5px;line-height:1.6;margin:0 auto 26px;max-width:400px;}

  /* five-stage path (intro) */
  .path{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 28px;}
  .path li{list-style:none;text-align:center;}
  .path img{width:100%;max-width:62px;height:auto;display:block;margin:0 auto 6px;}
  .path b{display:block;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.1em;color:var(--gold-bright);font-weight:600;}
  .path span{display:block;font-size:12px;line-height:1.3;color:var(--muted);margin-top:3px;}
  .path{padding:0;}

  .btn{
    display:block;width:100%;text-align:center;cursor:pointer;
    background:linear-gradient(180deg,#e9c466,#c4952c);
    border:1px solid var(--gold);color:#140f02;
    font-family:'Cinzel',serif;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;
    padding:16px 20px;border-radius:3px;text-decoration:none;
    transition:filter .2s ease;
  }
  .btn:hover,.btn:focus-visible{filter:brightness(1.1);outline:none;}
  .btn:focus-visible,.option:focus-visible,input:focus-visible{box-shadow:0 0 0 3px rgba(244,211,122,.45);outline:none;}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--line);margin-top:12px;}
  .btn-ghost:hover,.btn-ghost:focus-visible{background:transparent;color:var(--gold-bright);border-color:var(--gold);}

  /* progress */
  .field-progress{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .row-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;color:var(--muted);white-space:nowrap;}
  .track{flex:1;height:2px;background:var(--line);position:relative;}
  .fill{position:absolute;left:0;top:-1px;height:4px;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:2px;transition:width .45s ease;}

  .card{background:var(--card);border:1px solid var(--line);padding:28px 22px;border-radius:3px;}
  .q-text{
    font-family:'Playfair Display',serif;font-weight:600;font-style:italic;
    font-size:clamp(21px,5.5vw,25px);line-height:1.35;margin:0 0 24px;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    text-align:left;background:transparent;border:1px solid var(--line);color:var(--cream);
    font-family:'EB Garamond',serif;font-size:17px;line-height:1.35;padding:14px 16px;border-radius:3px;cursor:pointer;
    transition:border-color .2s ease,background .2s ease;
  }
  .option:hover{border-color:var(--gold);background:rgba(20,71,43,.55);}

  /* results */
  .badge-wrap{display:flex;justify-content:center;margin-bottom:18px;}
  .badge-wrap img{width:104px;height:auto;}
  .result-eyebrow{text-align:center;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .result-name{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(30px,8vw,40px);text-align:center;color:var(--gold-bright);margin:0 0 6px;}
  .result-stage{text-align:center;font-family:'Cinzel',serif;font-size:13px;letter-spacing:.14em;color:var(--gold);margin:0 0 4px;}
  .result-tag{text-align:center;font-style:italic;color:var(--muted);font-size:16px;margin:0 0 22px;}
  .result-desc{font-size:17.5px;line-height:1.7;margin:0 0 16px;}
  .result-desc em{color:var(--gold-bright);}
  .note{background:var(--green-deep);border:1px solid var(--line);border-radius:3px;padding:14px 16px;font-size:16px;line-height:1.55;margin:0 0 10px;}
  .note b{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:600;text-transform:uppercase;display:block;margin-bottom:4px;}
  .divider{height:1px;background:var(--line);margin:22px 0;}
  .breakdown-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:14px;}
  .breakdown-row .label{width:78px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.08em;color:var(--muted);}
  .breakdown-row .bar-track{flex:1;height:6px;background:rgba(255,255,255,.07);position:relative;border-radius:3px;}
  .breakdown-row .bar-fill{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:3px;transition:width .6s ease;}
  .breakdown-row.top .label{color:var(--gold-bright);}
  .breakdown-row .val{width:18px;text-align:right;color:var(--muted);}
  .cta-group{margin-top:26px;display:flex;flex-direction:column;}
  footer{text-align:center;margin-top:24px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1.8;}
  footer i{display:block;font-family:'Playfair Display',serif;font-size:15px;letter-spacing:.02em;text-transform:none;color:var(--gold);margin-top:4px;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>

const QUESTIONS = [
  { q:"When something new lands on your plate, your first move is to:", opts:[

    ["Turn it into a plan with dates and owners","elevate"],
    ["Think about who it affects and rally them","lead"],
    ["Check how it fits with what's already working","sustain"] ]},
  { q:"The people around you would say you're the one who:", opts:[
    ["Always knows what really matters","focus"],

    ["Keeps getting better and takes action","elevate"],
    ["Makes others feel capable and inspired","lead"],
    ["Keeps things steady for the long haul","sustain"] ]},
  { q:"When you hit a setback, you tend to:", opts:[

// Replace with your own Formspree endpoint (or any form-to-email service).
// Sign up free at https://formspree.io, create a form, and paste its endpoint here.
const FORM_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";

let current = 0, scores = {}, leadEmail = "";
const app = document.getElementById('app');
const resetScores = () => { scores = {}; STAGES.forEach(s => scores[s] = 0); };
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const ranked = () => STAGES.slice().sort((a,b) => scores[b]-scores[a]);

function renderIntro(){
  app.innerHTML = `
    <img class="logo" src="${LOGO}" alt="F.E.E.L.S. Method for Personal Growth &amp; Empowered Living">
    <h1>Find Your <span class="script">Purpose Field</span></h1>
    <p class="lede">Ten short questions about how you grow and lead. You'll see which stage of the F.E.E.L.S. Method you naturally lead from, and which stage your purpose is asking you to grow into next.</p>
    <ul class="path" aria-label="The five F.E.E.L.S. stages">
      ${STAGES.map(s => `<li><img src="${PROFILES[s].img}" alt=""><b>${PROFILES[s].stage}</b><span>${PROFILES[s].tag.split('. ')[0].replace(/\.$/,'')}</span></li>`).join('')}
    </ul>
    <button class="btn" id="startBtn">Begin the Quiz</button>
  `;
  document.getElementById('startBtn').addEventListener('click', () => { current = 0; resetScores(); renderQuestion(); });
}

function renderQuestion(){
  const total = QUESTIONS.length, item = QUESTIONS[current];
  const pct = Math.round((current / total) * 100);
  app.innerHTML = `
    <div class="field-progress">
      <span class="row-label">Question ${current+1} of ${total}</span>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div class="card">
      <p class="q-text">${item.q}</p>
      <div class="options">
        ${shuffle(item.opts).map(o => `<button class="option" data-key="${o[1]}">${o[0]}</button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.option').forEach(btn => btn.addEventListener('click', () => {
    scores[btn.dataset.key] += 1;
    current += 1;
    current < QUESTIONS.length ? renderQuestion() : renderEmailGate();
  }));
}

function renderEmailGate(){
  app.innerHTML = `
    <div class="eyebrow">Your Purpose Field Is Ready</div>
    <h1>Where Should We <span class="script">Send It</span>?</h1>
    <p class="lede">Enter your email to reveal your F.E.E.L.S. stage and get your full results sent to your inbox.</p>
    <div class="card">
      <form id="gateForm">
        <div class="options" style="margin-bottom:16px;">
          <input type="email" id="gateEmail" required placeholder="you@email.com" aria-label="Email address"
            style="background:transparent;border:1px solid var(--line);color:var(--cream);font-family:'EB Garamond',serif;font-size:17px;padding:15px 16px;border-radius:3px;width:100%;">
        </div>
        <label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin-bottom:22px;line-height:1.5;">
          <input type="checkbox" id="gateConsent" required style="margin-top:3px;">
          <span>Send me my results and occasional follow-up from Fields of Freedom. Unsubscribe anytime.</span>
        </label>
        <button type="submit" class="btn" id="gateSubmit">Reveal My Purpose Field</button>
        <p id="gateError" role="alert" style="color:#e0906f;font-size:14px;text-align:center;margin:12px 0 0;display:none;">Enter a valid email and check the box to continue.</p>
      </form>
    </div>
  `;
  document.getElementById('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('gateEmail').value.trim();
    const errorEl = document.getElementById('gateError');
    if (!email || !document.getElementById('gateConsent').checked) { errorEl.style.display = 'block'; return; }
    leadEmail = email;
    const submitBtn = document.getElementById('gateSubmit');
    submitBtn.textContent = "Sending..."; submitBtn.disabled = true;
    const top = PROFILES[ranked()[0]];
    try {
      await fetch(FORM_ENDPOINT, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Accept":"application/json" },
        body: JSON.stringify({ email, purpose_field: top.name, feels_stage: top.stage, scores, source:"Purpose Finder Quiz" })
      });
    } catch (err) {
      // Non-blocking: even if the send fails, still show the results on-screen.
      console.error("Lead capture failed:", err);
    }
    renderResults();
  });
}

function renderResults(){
  const order = ranked(), topKey = order[0], p = PROFILES[topKey], nxt = PROFILES[p.next], total = QUESTIONS.length;
  app.innerHTML = `
    <div class="badge-wrap"><img src="${p.img}" alt="${p.stage} stage icon"></div>
    <div class="result-eyebrow">Your Purpose Field Is</div>
    <h2 class="result-name">${p.name}</h2>
    <p class="result-stage">Home stage: ${p.stage} · ${p.weeks}</p>
    <p class="result-tag">${p.tag}</p>
    <p class="result-desc">${p.desc}</p>
    <div class="note"><b>Your gift</b>${p.gift}</div>
    <div class="note"><b>Your growth edge</b>${p.edge}</div>
    <div class="note"><b>Next stage: ${nxt.stage}</b>${nxt.tag}</div>
    <div class="divider"></div>
    ${order.map((key,i) => `
      <div class="breakdown-row${i===0?' top':''}">
        <span class="label">${PROFILES[key].stage}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round((scores[key]/total)*100)}%"></div></div>
        <span class="val">${scores[key]}</span>
      </div>`).join('')}
    <div class="cta-group">
      <a class="btn" href="https://stan.store/aprealfeels" target="_blank" rel="noopener">Take Your Next Step</a>
      <button class="btn btn-ghost" id="retakeBtn">Retake the Quiz</button>
    </div>
    <footer>Focus · Explore · Elevate · Lead · Sustain<i>Build the You That Builds Generations</i>Fields of Freedom</footer>
  `;
  document.getElementById('retakeBtn').addEventListener('click', renderIntro);
}

renderIntro();
